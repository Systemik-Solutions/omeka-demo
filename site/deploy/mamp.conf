# MAMP serves the compiled site; the project source stays outside the web root.
# The main MAMP DocumentRoot is /Applications/MAMP/htdocs/curated-collections/dist.
Alias "/curated-collections" "/Applications/MAMP/htdocs/curated-collections/dist"

<Directory "/Applications/MAMP/htdocs/curated-collections">
    AllowOverride None
    Require all denied
</Directory>

<Directory "/Applications/MAMP/htdocs/curated-collections/dist">
    Options -Indexes -MultiViews
    AllowOverride None
    Require local
    DirectoryIndex index.html
    ErrorDocument 404 /404.html
</Directory>
